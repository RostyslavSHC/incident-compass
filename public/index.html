<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aurelis. Intelligence. Awareness. Action. Investigate cloud incidents and get the right responder on call.">
  <title>A U R E L I S | On-call desk</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./aurelis-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to dashboard</a>
  <div class="frame">
    <header class="top">
      <a class="brand" href="#desk" aria-label="Aurelis home"><img class="brand-mark" src="./aurelis-mark.png" width="44" height="44" alt="">
        <span class="brand-copy"><strong>A U R E L I S</strong><small>Intelligence. Awareness. Action.</small></span>
      </a>
      <button class="small nav-toggle" id="nav-toggle" type="button" aria-controls="workspace-nav" aria-expanded="false">Menu</button>
      <nav id="workspace-nav" aria-label="Workspace">
        <a href="#desk" data-view="desk">Desk</a>
        <a href="#alerts" data-view="alerts">Alerts</a>
        <a href="#simulator" data-view="simulator">Incident simulator</a>
        <a href="#services" data-view="services">Services</a>
        <a href="#history" data-view="history">History</a>
        <a href="#runbooks" data-view="runbooks">Runbooks</a>
        <a href="#calendar" data-view="calendar">Calendar</a>
        <a href="#chat" data-view="chat"># General <span id="chat-count" hidden></span></a>
      </nav>
      <div class="top-right">
        <div class="persona-picker">
          <button class="small persona-trigger" id="persona" type="button" popovertarget="persona-menu" aria-controls="persona-menu" aria-haspopup="menu" aria-expanded="false">
            <span class="persona-signal" aria-hidden="true"></span><span id="persona-name"></span><span class="persona-caret" aria-hidden="true"></span>
          </button>
          <div class="persona-menu" id="persona-menu" popover="auto" role="menu" aria-label="Act as responder"></div>
        </div>
        <button class="small" id="notifications" data-notifications>Notifications <span id="notification-count" class="count-pill" hidden></span></button>
        <button class="small" id="night" aria-pressed="false" title="Toggle simplified on-call view">3 a.m. mode</button>
      </div>
    </header>
    <main id="main" tabindex="-1"><section class="loading-surface" role="status"><span class="sr-only">Loading the incident workspace</span><i></i><i></i><i></i></section></main>
    <footer><span>A U R E L I S / BRAMPTON AI INNOVATOR</span><span>FICTIONAL DATA · EASTERN TIME</span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="assistant-window" aria-labelledby="assistant-title"></dialog>
  <div id="toast-announcer" class="sr-only" role="status" aria-atomic="true"></div>
  <div id="toast-stack" aria-label="Recent notifications"></div>
</body>
</html>
